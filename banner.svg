<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Global Cyber Attack Monitor — Live</title>
<desc id="desc">Animated world cyber threat banner using recent anonymized honeypot telemetry from OffSeq Mirage.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030916"/><stop offset="1" stop-color="#091d2d"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#0ea5e9" stop-opacity=".18"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#16445c" stroke-opacity=".3"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect x="395" y="28" width="770" height="330" rx="18"/></clipPath>
 <style>
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-out infinite}
  .pulse2{animation-delay:.8s}
  .flow{stroke-dasharray:7 12;animation:flow 2.4s linear infinite}
  .blink{animation:blink 1.1s steps(2,end) infinite}
  @keyframes pulse{0%{transform:scale(.65);opacity:.9}100%{transform:scale(2.8);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-38}}
  @keyframes blink{50%{opacity:.28}}
 </style>
</defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/><rect width="1200" height="400" rx="18" fill="url(#grid)"/>
